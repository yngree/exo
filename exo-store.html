<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EXO — магазин брендовой одежды</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Onest:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--fg:#0a0a0a;--mut:#6b6b6b;--tile:#efefef;--line:#e2e2e2;--g:#00c853;--gd:#00963e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0a0a;--fg:#f5f5f5;--mut:#9a9a9a;--tile:#1c1c1c;--line:#2a2a2a}}
:root[data-theme="dark"]{--bg:#0a0a0a;--fg:#f5f5f5;--mut:#9a9a9a;--tile:#1c1c1c;--line:#2a2a2a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:400 16px/1.5 Onest,system-ui,Arial,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--g);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:20px;padding:12px 20px}
.logo{display:block;height:40px;flex:none}
nav{display:flex;gap:6px;flex:1;overflow-x:auto}
nav button{background:none;border:0;padding:8px 12px;font-weight:500;border-radius:8px;white-space:nowrap}
nav button[aria-pressed=true]{background:var(--fg);color:var(--bg)}
.cartbtn{background:var(--g);color:#000;border:0;border-radius:8px;padding:9px 16px;font-weight:600}
.hero{background:var(--g);color:#000;padding:56px 20px 48px;display:grid;gap:24px}
.hero h1{font:800 clamp(34px,8vw,84px)/1 Unbounded,Arial,sans-serif;margin:0;max-width:12ch;letter-spacing:-.03em}
.hero p{margin:0;max-width:44ch;font-size:18px}
.hero .row{display:flex;gap:12px;flex-wrap:wrap}
.btn{background:#000;color:#fff;border:0;border-radius:8px;padding:13px 22px;font-weight:600}
.btn.alt{background:transparent;color:#000;border:2px solid #000}
main{padding:32px 20px 64px;max-width:1280px;margin:0 auto}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:24px}
.chip{border:1px solid var(--line);background:none;border-radius:99px;padding:7px 14px}
.chip[aria-pressed=true]{background:var(--g);border-color:var(--g);color:#000;font-weight:600}
.bar select{margin-left:auto;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px}
h2{font:800 clamp(22px,4vw,34px)/1.1 Unbounded,Arial,sans-serif;margin:0 0 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px}
.card .ph{background:var(--tile);aspect-ratio:4/5;border-radius:12px;display:grid;place-items:center;overflow:hidden;position:relative}
.card .ph svg,.card .ph img{width:78%;height:auto}
.card .ph img{width:100%;height:100%;object-fit:contain}.card .ph:has(img){background:#fff}.line .t img{width:100%;height:100%;object-fit:contain;border-radius:8px;background:#fff}
.tag{position:absolute;left:10px;top:10px;background:#000;color:#fff;font-size:12px;padding:3px 8px;border-radius:99px}
.card .b{color:var(--mut);font-size:13px;margin-top:10px}
.card .n{font-weight:600}
.card .pr{font-weight:600;margin:2px 0 8px}
.card .act{display:flex;gap:8px}
.card select{flex:1;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px}
.card .add{background:var(--fg);color:var(--bg);border:0;border-radius:8px;padding:8px 14px;font-weight:600}
.sw{display:flex;gap:8px;align-items:center;margin:8px 0}.sw button{width:22px;height:22px;border-radius:50%;border:1px solid var(--line);padding:0}.sw button[aria-pressed=true]{outline:2px solid var(--fg);outline-offset:2px}.sw span{font-size:13px;color:var(--mut);margin-left:4px}
.ar{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:22px;line-height:1;padding:0}.ar.l{left:8px}.ar.r{right:8px}.dots{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:center;gap:6px}.dots i{width:7px;height:7px;border-radius:50%;background:rgba(0,0,0,.25)}.dots i.on{background:#000}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:10;display:none}
.scrim.on{display:block}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--bg);z-index:11;padding:20px;padding-top:calc(20px + env(safe-area-inset-top,0px));padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));overflow-y:auto;transform:translateX(100%);transition:transform .25s}
.panel.on{transform:none}
.panel h3{font:800 22px Unbounded,Arial,sans-serif;margin:0 0 16px}
.x{position:absolute;right:14px;top:14px;background:none;border:0;font-size:26px}
.line{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.line .t{background:var(--tile);border-radius:8px;height:56px;display:grid;place-items:center}
.line .t svg{width:80%}
.qty{display:flex;gap:8px;align-items:center;margin-top:4px}
.qty button{width:28px;height:28px;border-radius:6px;border:1px solid var(--line);background:none}
.tot{display:flex;justify-content:space-between;font-weight:600;font-size:18px;margin:16px 0}
.btn.g{background:var(--g);color:#000;width:100%}
.btn:disabled{opacity:.5}
label{display:block;font-size:14px;color:var(--mut);margin:12px 0 4px}
input{width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit}
.qr{background:#fff;padding:12px;border-radius:12px;width:210px;margin:12px auto}
.banks{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.banks button{border:1px solid var(--line);background:none;border-radius:8px;padding:10px}
.banks button[aria-pressed=true]{border-color:var(--g);background:var(--g);color:#000;font-weight:600}
.st{text-align:center;font-weight:600;padding:10px;border-radius:8px;background:var(--tile)}
.st.ok{background:var(--g);color:#000}
.note{color:var(--mut);font-size:13px;margin-top:12px}
.empty{color:var(--mut);padding:24px 0}
footer{background:var(--fg);color:var(--bg);padding:32px 20px;display:flex;gap:24px;flex-wrap:wrap;justify-content:space-between;align-items:flex-start}
footer p{margin:4px 0;opacity:.75;font-size:14px}
@media (prefers-reduced-motion:reduce){.panel{transition:none}}
</style>
</head>

<header>
<a href="#" aria-label="EXO"><svg class="logo" viewBox="0 0 112 48" width="94" role="img"><use href="#lg"/></svg></a>
<nav id="nav"></nav>
<button class="cartbtn" id="cb">Корзина · <span id="cc">0</span></button>
</header>

<section class="hero">
<h1>Одежда, которую носят</h1>
<p>Куртки, кроссовки, футболки и худи — мужские и женские коллекции сезона.</p>
<div class="row"><button class="btn" onclick="go('shop')">Смотреть коллекцию</button><button class="btn alt" onclick="setG('w');go('shop')">Для неё</button></div>
</section>

<main id="shop">
<h2>Каталог</h2>
<div class="bar" id="bar"></div>
<div class="grid" id="grid"></div>
</main>

<footer>
<div><svg class="logo" viewBox="0 0 112 48" width="94"><use href="#lg"/></svg><p>Брендовая одежда и обувь</p></div>
<div><p>Доставка и оплата</p><p>Возврат в течение 14 дней</p><p>Оплата через СБП</p></div>
<div><p>hello@exo.store</p><p>+7 (000) 000-00-00</p></div>
</footer>

<div class="scrim" id="sc"></div>
<aside class="panel" id="pn" aria-live="polite"></aside>

const f=(x,y)=>{const p=(a,b)=>a<7&&b<7||a>n-8&&b<7||a<7&&b>n-8;return p(x,y)&&!(x>0&&x<6&&y>0&&y<6&&!(x>1&&x<5&&y>1&&y<5))&&!(x%(n-7)==0&&0)};

if((x<7||x>n-8)&&(y<7||y>n-8)&&!(x>n-8&&y>n-8)){on=cx==0||cx==6||cy==0||cy==6||(cx>1&&cx<5&&cy>1&&cy<5)}else on=r()>.5;
if(on)o+=`<rect x="${x}" y="${y}" width="1" height="1"/>`}
return `<svg viewBox="0 0 ${n} ${n}" width="100%" role="img" aria-label="QR-код СБП">${o}</svg>`}
